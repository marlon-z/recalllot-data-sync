name: USDA official data refresh
on:
  workflow_dispatch:
  push:
    paths:
      - automation/usda_snapshot.py
      - .github/workflows/usda-refresh.yml
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: usda-official-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate the official USDA API
        run: python3 automation/usda_snapshot.py --output snapshot
      - name: Publish validated public data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshot/usda.json.gz snapshot/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official USDA data [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: usda-official-snapshot
          path: snapshot/
          retention-days: 7
          if-no-files-found: error
